<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Calculator Pro</title>
    <style>
        :root { --bg-color: #0c0d14; --card-bg: #161722; --border-color: #2b2c3d; --text-main: #ffffff; --accent-purple: #c084fc; --accent-green: #22c55e; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; max-width: 500px; margin: 0 auto; font-family: sans-serif; }
        
        /* Layout Fixes */
        .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .input-group { margin-bottom: 10px; }
        .input-control { width: 100%; background: #1f202e; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 6px; }
        
        /* Chart Fix */
        .chart-container { background: #161722; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-bottom: 20px; }
        canvas { width: 100%; height: 150px; display: block; }
        
        .tab-view { display: none; }
        .tab-view.active { display: block; }
    </style>
</head>
<body>

    <h1>PSE Trading Engine</h1>

    <!-- Dito yung 2 dropdown side-by-side -->
    <div class="grid-2x2">
        <div class="input-group">
            <label style="font-size: 0.7rem;">ASSET</label>
            <select id="asset-selector" class="input-control" onchange="updateData()">
                <option value="BDO">BDO</option>
                <option value="MER">MERALCO (MER)</option>
                <option value="SMPH">SMPH</option>
                <option value="JFC">JFC</option>
            </select>
        </div>
        <div class="input-group">
            <label style="font-size: 0.7rem;">STRATEGY</label>
            <select id="strategy-mode" class="input-control" onchange="updateData()">
                <option value="ICT">ICT</option>
                <option value="SMC">SMC</option>
            </select>
        </div>
    </div>

    <!-- Graph Container -->
    <div class="chart-container">
        <canvas id="candleChart"></canvas>
    </div>

    <div id="view-input" class="tab-view active">
        <div class="grid-2x2">
            <div class="input-group"><label>OPEN</label><input type="text" id="inp-open" class="input-control" readonly></div>
            <div class="input-group"><label>CLOSE</label><input type="text" id="inp-close" class="input-control" readonly></div>
        </div>
    </div>

    <script>
        let candles = [{o:100, c:105, h:110, l:95}, {o:105, c:102, h:108, l:100}];

        function drawChart() {
            const canvas = document.getElementById('candleChart');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            candles.forEach((c, i) => {
                let x = i * 60 + 20;
                ctx.fillStyle = c.c >= c.o ? '#22c55e' : '#ef4444';
                ctx.fillRect(x, 100 - (c.c - 90)*2, 40, (c.c - c.o)*2 || 5);
            });
        }

        function updateData() {
            // Meralco baseline logic
            let symbol = document.getElementById('asset-selector').value;
            let base = (symbol === 'MER') ? 395.00 : 100.00;
            let o = (base + Math.random()*5).toFixed(2);
            let c = (base + Math.random()*5).toFixed(2);
            
            document.getElementById('inp-open').value = o;
            document.getElementById('inp-close').value = c;
            
            candles.push({o: parseFloat(o), c: parseFloat(c), h: parseFloat(o)+2, l: parseFloat(o)-2});
            if(candles.length > 6) candles.shift();
            drawChart();
        }

        window.onload = () => {
            updateData();
            setInterval(updateData, 4000);
        };
    </script>
</body>
</html>
